name: Deploy Panupan22 to Vercel

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_I1QdXCQYM2Zp8GE6FK3ULJpg
      VERCEL_PROJECT_ID: prj_Cq77AnpC2BomLXeNaZjrU5diZ8Wv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          RAILWAY_ENVIRONMENT_NAME: production
      - run: npx vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
