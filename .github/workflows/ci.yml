name: Panupan22 CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      # Generate TanStack's file-based route tree before TypeScript checks.
      - run: npm run build:dev
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
