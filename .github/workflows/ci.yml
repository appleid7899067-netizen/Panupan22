name: Panupan22 CI
# Production gate: typecheck + lint + regression + build + real HTTP boot

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      # Generate TanStack's file-based route tree before TypeScript checks.
      - run: npm run build:dev
      - run: npm run typecheck
      - run: npm run lint
      # Full regression suite, including auth/PWA/migration contracts.
      - run: npm test
      # Production build must include every runtime asset required by the server.
      - run: RAILWAY_ENVIRONMENT_NAME=ci npm run build
      # Boot the exact production artifact and require a real HTTP response.
      - run: npm run smoke:production
